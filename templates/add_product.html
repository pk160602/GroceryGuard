{% extends "base.html" %}

{% block title %}
Add Product — GroceryGuard
{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <h1>Add Product</h1>

        <p>Add new inventory to your shop.</p>

    </div>

</div>


<form method="POST" class="form-card">

    <div class="form-grid">

        <div class="form-group">

            <label>Product Name</label>

            <input
                type="text"
                name="name"
                required
                placeholder="e.g. Rice 5kg">

        </div>


        <div class="form-group">

            <label>Category</label>

            <input
                type="text"
                name="category"
                required
                placeholder="e.g. Grocery">

        </div>


        <div class="form-group">

            <label>Quantity</label>

            <input
                type="number"
                name="quantity"
                min="0"
                required>

        </div>


        <div class="form-group">

            <label>Purchase Price</label>

            <input
                type="number"
                name="purchase_price"
                min="0"
                step="0.01"
                required>

        </div>


        <div class="form-group">

            <label>Selling Price</label>

            <input
                type="number"
                name="selling_price"
                min="0"
                step="0.01"
                required>

        </div>


        <div class="form-group">

            <label>Supplier Name</label>

            <input
                type="text"
                name="supplier_name"
                placeholder="Supplier name">

        </div>


        <div class="form-group">

            <label>Expiry Date</label>

            <input
                type="date"
                name="expiry_date">

        </div>


        <div class="form-group">

            <label>Minimum Stock</label>

            <input
                type="number"
                name="minimum_stock"
                value="5"
                min="0"
                required>

        </div>

    </div>


    <div class="form-actions">

        <button
            type="submit"
            class="btn">

            Save Product

        </button>


        <a
            href="{{ url_for('inventory') }}"
            class="btn secondary">

            Cancel

        </a>

    </div>

</form>

{% endblock %}
